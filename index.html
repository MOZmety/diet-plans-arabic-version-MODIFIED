<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خطط الدايت — التضخيم والتنشيف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#07080b; --ink:#f3f4f6; --mute:#9aa0ab; --line:rgba(255,255,255,.09); --glass:rgba(255,255,255,.045);
  --prot:#4ade80; --carb:#fbbf24; --fat:#a78bfa;
  --a1:#ff3b4a; --a2:#ff9a3d; --pa:#ff3b4a; --pb:#ff9a3d; --ta:#ff3b4a; --tb:#ff9a3d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --disp:'Bricolage Grotesque','DM Sans',system-ui,sans-serif; --body:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--body);color:var(--ink);-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}

#stage{--a1:#ff3b4a;--a2:#ff9a3d;position:relative;width:1280px;height:720px;flex:none;transform-origin:center;background:radial-gradient(620px 620px at 90% -6%,color-mix(in srgb,var(--a1) 30%,transparent),transparent 70%),radial-gradient(520px 520px at -6% 108%,color-mix(in srgb,var(--a2) 18%,transparent),transparent 70%),var(--bg);overflow:hidden;border-radius:10px}
#stage[data-deck="cut"]{--a1:#22d3ee;--a2:#86efac}

.slide{position:absolute;inset:0;padding:70px 76px 56px;opacity:0;visibility:hidden;pointer-events:none;z-index:1;contain:layout paint;
  transition:opacity .6s cubic-bezier(.22,.8,.3,1),transform .8s cubic-bezier(.22,.8,.3,1),visibility 0s .8s;
  display:flex;flex-direction:column;justify-content:center}
.slide.after{transform:translateX(7%) scale(.97)}
.slide.before{transform:translateX(-7%) scale(.97)}
.slide[data-t="zoom"].after{transform:scale(1.14)}
.slide[data-t="zoom"].before{transform:scale(.9)}
.slide[data-t="rise"].after{transform:translateY(7%)}
.slide[data-t="rise"].before{transform:translateY(-7%)}
.slide.active{opacity:1;transform:none;visibility:visible;transition-delay:0s;pointer-events:auto;z-index:3}
.slide.active [data-a]{animation:in .8s cubic-bezier(.22,.8,.3,1) both;animation-delay:calc(var(--i,0)*80ms + 220ms)}
@keyframes in{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- shared ---------- */
.grad{background:linear-gradient(100deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;padding:8px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:15px;font-weight:700;color:#e5e7eb}
.chip i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 0 12px var(--a1)}
h1,h2{font-family:var(--disp);font-weight:800;letter-spacing:-.03em;line-height:.98}
h2{font-size:58px;margin-top:20px}
h2 small{font-size:.46em;font-weight:500;color:var(--mute);letter-spacing:0;margin-inline-start:10px}
.lead{font-size:21px;color:#c3c8d1;margin-top:14px;line-height:1.5}
.card{background:var(--glass);border:1px solid var(--line);border-radius:28px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 45%);pointer-events:none}
.photo{transform:scale(var(--z,1));transform-origin:var(--o,50% 50%);background-size:cover;background-position:center;position:relative}
.counter{position:absolute;top:30px;right:40px;font-family:var(--disp);font-weight:700;font-size:16px;color:var(--mute);z-index:9;letter-spacing:.04em}
.counter b{color:var(--ink)}

/* ---------- title ---------- */
.title{flex-direction:row;align-items:center;gap:56px;padding-right:70px}
.title .txt{flex:1;display:flex;flex-direction:column}
.title h1{font-size:112px;margin:26px 0 8px}
.title .en{font-size:25px;color:#c9ced6;line-height:1.4}
.title .ar{font-family:Cairo,sans-serif;font-weight:800;font-size:31px;direction:rtl;text-align:left;margin-top:18px}
.title .hint{margin-top:44px;font-size:14px;color:var(--mute);display:flex;gap:10px;align-items:center}
.title .hint kbd{font:700 13px var(--body);padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:var(--glass);color:#d4d8df}
.arch{width:400px;height:560px;flex:none;border-radius:200px 200px 28px 28px;border:1px solid var(--line);box-shadow:0 30px 90px -20px color-mix(in srgb,var(--a1) 55%,transparent);overflow:hidden;position:relative}
.arch .photo{position:absolute;inset:0}
.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(7,8,11,.55))}
.float{position:absolute;z-index:4;padding:13px 18px;border-radius:18px;background:rgba(14,15,20,.92);border:1px solid var(--line);font-weight:700}
.float b{display:block;font-family:var(--disp);font-size:30px;line-height:1}
.float span{font-size:13px;color:var(--mute);font-weight:500}
.title .wrap{position:relative}

/* ---------- macros ---------- */
.bento{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;height:400px;margin-top:34px}
.m{padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between}
.m .l{font-size:16px;font-weight:700;color:var(--c);display:flex;align-items:center;gap:9px}
.m .l::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.m .v{font-family:var(--disp);font-weight:800;font-size:64px;letter-spacing:-.03em;line-height:1}
.m .v small{font-size:20px;font-weight:500;color:var(--mute);margin-inline-start:6px;letter-spacing:0}
.m.big{grid-row:span 2;--c:var(--a1)}
.m.big .v{font-size:132px}
.m .meter{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.m .meter i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:6px;transform-origin:left}
.slide.active .meter i{animation:grow 1.2s .7s cubic-bezier(.22,.8,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.m.wide{grid-column:span 2}

/* ---------- phases ---------- */
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;position:relative}
.ph{padding:26px 26px 24px;display:flex;flex-direction:column;gap:16px}
.ph .h{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:18px}
.ph .h span{color:var(--mute);font-weight:500;font-size:15px}
.ph .k{font-family:var(--disp);font-weight:800;font-size:60px;letter-spacing:-.03em;line-height:1}
.ph .k small{font-size:20px;color:var(--mute);font-weight:500;margin-inline-start:6px;letter-spacing:0}
.ph .mm{display:flex;gap:8px}
.ph .mm span{flex:1;padding:8px 0;text-align:center;border-radius:12px;background:rgba(255,255,255,.05);font-size:14px;font-weight:700;color:#d6dae1}
.ph .mm span em{font-style:normal;color:var(--mute);margin-inline-end:5px;font-weight:500}
.ph .rise{height:var(--h);min-height:6px;border-radius:8px;background:linear-gradient(180deg,var(--a1),color-mix(in srgb,var(--a2) 40%,transparent));transform-origin:bottom}
.slide.active .rise{animation:up 1s .8s cubic-bezier(.22,.8,.3,1) both}
@keyframes up{from{transform:scaleY(0)}}
.ph.hot{border-color:color-mix(in srgb,var(--a1) 60%,transparent)}
.delta{font-weight:700;font-size:15px;color:var(--a2)}
.phases2{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:38px;max-width:820px}

/* ---------- meal ---------- */
.meal{flex-direction:row;align-items:center;gap:44px}
.meal .left{flex:1;display:flex;flex-direction:column;min-width:0}
.meal .desc{font-size:22px;line-height:1.6;color:#d1d5db;margin-top:22px;max-width:560px}
.meal .ar{font-family:Cairo,sans-serif;direction:rtl;text-align:right;font-size:23px;line-height:1.75;color:#dfe3ea;margin-top:24px;padding:22px 26px;border-radius:18px;background:var(--glass);border:1px solid var(--line);max-width:560px;font-weight:600}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:30px}
.steps div{display:flex;align-items:center;gap:14px;font-size:17px;color:#d6dae1}
.steps b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--disp);color:#0b0c10;background:linear-gradient(135deg,var(--a1),var(--a2));flex:none}
.meal .right{width:430px;flex:none;padding:30px;display:flex;flex-direction:column;gap:22px}
.shot{margin:-30px -30px 0;height:150px;position:relative;flex:none;overflow:hidden}
.shot .photo{position:absolute;inset:0;background-position:50% 55%}
.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(11,12,16,.92))}
.donut{position:relative;width:190px;height:190px;margin:0 auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .c b{font-family:var(--disp);font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.donut .c span{font-size:14px;color:var(--mute);font-weight:500;margin-top:4px}
.reveal{stroke-dasharray:0 100}
.slide.active .reveal{animation:ring 1.3s .6s cubic-bezier(.22,.8,.3,1) both}
@keyframes ring{from{stroke-dasharray:0 100}to{stroke-dasharray:100 0}}
.mac{display:flex;flex-direction:column;gap:14px}
.mac>div{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:16px;font-weight:700;align-items:center}
.mac>div>span:first-child{display:flex;gap:9px;align-items:center}
.mac>div>span:first-child::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.mac em{font-style:normal;color:var(--mute);font-weight:500;margin-inline-start:8px}
.mac .meter{display:block;grid-column:1/-1;height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.mac .meter i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:5px;transform-origin:left}
.slide.active .mac .meter i{animation:grow 1.1s .9s cubic-bezier(.22,.8,.3,1) both}
.card .ttl{font-weight:700;font-size:15px;color:var(--mute)}
.items{display:flex;flex-direction:column;gap:12px}
.items div{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.items b{font-family:var(--disp);font-size:19px;font-weight:800;min-width:92px;color:var(--a2)}
.items span{font-size:16px;color:#e1e4ea;line-height:1.35}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:1.1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:16px;height:430px;margin-top:30px}
.gal .card{border-radius:26px}
.gal .photo{position:absolute;inset:0}
.gal .g1{grid-row:span 2}
.gal .g4{grid-column:span 2}
.gal .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(7,8,11,.5));z-index:2}
.slide.active .gal .card .photo{animation:zoomin 1.6s .3s cubic-bezier(.22,.8,.3,1) both}
@keyframes zoomin{from{transform:scale(1.15)}}

/* ---------- closing ---------- */
.close{flex-direction:row;align-items:center;gap:60px}
.close .txt{flex:1;display:flex;flex-direction:column}
.close h1{font-size:72px;margin:24px 0 0;white-space:nowrap}
.close p{font-size:24px;color:#c9ced6;margin-top:18px;line-height:1.4}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:38px;max-width:480px}
.pills div{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:16px}
.pills i{font-style:normal;font-size:22px}
.close .frame{width:420px;height:560px;flex:none;border-radius:34px;overflow:hidden;position:relative;border:1px solid var(--line);box-shadow:0 30px 90px -20px color-mix(in srgb,var(--a1) 55%,transparent)}
.close .frame .photo{position:absolute;inset:0}
.close .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(7,8,11,.6))}

/* ---------- progress (slide 12) ---------- */
.prog{flex-direction:row;align-items:center;gap:70px}
.prog .pf{width:440px;height:580px;flex:none;border-radius:220px 220px 34px 34px;overflow:hidden;position:relative;border:1px solid var(--line);box-shadow:0 30px 90px -20px color-mix(in srgb,var(--a1) 55%,transparent)}
.prog .pf .photo{position:absolute;inset:0}
.prog.active .pf .photo{animation:zoomin 6s .2s ease-out both}
@keyframes zoomin{from{transform:scale(1.18)}to{transform:scale(1)}}
.prog .pf::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(7,8,11,.55))}
.prog .txt{flex:1;display:flex;flex-direction:column}
.prog h1{font-size:96px;margin:24px 0 0}
.prog .lead{font-size:26px;margin-top:22px}
.sts{display:flex;gap:14px;margin-top:40px}
.sts .card{padding:18px 24px;border-radius:22px;display:flex;flex-direction:column;gap:4px}
.sts b{font-family:var(--disp);font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em}
.sts span{font-size:14px;color:var(--mute);font-weight:500}

/* ---------- contact ---------- */
.contact{justify-content:center}
.contact .bg{position:absolute;inset:0;z-index:-1}
.contact .bg .photo{position:absolute;inset:0;opacity:.55}
.contact .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,8,11,.96) 25%,rgba(7,8,11,.55) 70%,rgba(7,8,11,.25))}
.contact .txt{display:flex;flex-direction:column;position:relative}
.contact h1{font-size:120px;margin:24px 0 0}
.contact .num{display:inline-block;align-self:flex-start;font-family:var(--disp);font-weight:800;font-size:92px;letter-spacing:-.02em;line-height:1;margin-top:34px;text-decoration:none;direction:ltr}
.btns{display:flex;gap:14px;margin-top:34px}
.btns a{padding:15px 32px;border-radius:99px;font-weight:700;font-size:18px;text-decoration:none;border:1px solid var(--line)}
.btns .b1{background:linear-gradient(100deg,var(--a1),var(--a2));color:#0b0c10;border-color:transparent}
.btns .b2{background:var(--glass);color:#fff;}

/* ---------- closing contact card ---------- */
.cc{align-self:flex-start;padding:26px 32px;margin-top:34px;display:flex;flex-direction:column;gap:6px}
.cc .nm{font-family:var(--disp);font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1.1}
.cc .tel{font-family:var(--disp);font-weight:800;font-size:56px;letter-spacing:-.02em;line-height:1.05;color:var(--ink);text-decoration:none;direction:ltr}
.cc .btns{margin-top:16px}
.cc .btns a{padding:12px 28px;font-size:16px}

/* ---------- UI ---------- */
#top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;padding:4px;border-radius:99px;background:rgba(14,15,20,.8);border:1px solid var(--line);}
#top button{all:unset;cursor:pointer;padding:8px 20px;border-radius:99px;font:700 14px var(--body);color:var(--mute);transition:.3s}
#top button.on{color:#0b0c10;background:linear-gradient(100deg,var(--ta),var(--tb))}
#top button:focus-visible,#ui button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#ui{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;z-index:50;opacity:0;transition:opacity .3s}
body:hover #ui,body.touch #ui{opacity:1}
#ui button{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:rgba(14,15,20,.85);border:1px solid var(--line);font-size:18px;color:#fff;}
#ui button:hover{background:rgba(255,255,255,.14)}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--pa),var(--pb));transition:width .6s cubic-bezier(.22,.8,.3,1);z-index:70}
@media (prefers-reduced-motion:reduce){
  .slide,.slide.active [data-a],.slide.active *{transition-duration:.01s !important;animation-duration:.01s !important;animation-delay:0s !important}
}

/* ================= MOBILE: fluid stage (logical width >= 390, height >= 640) scaled to the screen ================= */
html.mob,html.mob body{height:100%;padding:0}
body.mob{display:block}
body.mob #stage{position:fixed;left:0;top:0;transform-origin:0 0;border-radius:0}
body.mob .slide{padding:64px 20px 84px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;justify-content:safe center}
body.mob .slide::-webkit-scrollbar{display:none}
body.mob .counter{top:auto;bottom:26px;right:22px;font-size:14px}
body.mob h2{font-size:36px;margin-top:14px}
body.mob h2 small{display:block;margin:6px 0 0;font-size:.5em}
body.mob .lead{font-size:16px;margin-top:8px}
body.mob .chip{font-size:13px;padding:6px 13px}
/* title */
body.mob .title{flex-direction:column-reverse;gap:20px;padding:64px 20px 84px}
body.mob .title .txt{flex:none}
body.mob .title h1{font-size:56px;margin:14px 0 6px}
body.mob .title .en{font-size:17px}
body.mob .title .hint{margin-top:16px}
body.mob .title .wrap{flex:1;min-height:200px;align-self:center;display:flex}
body.mob .arch{width:min(300px,calc(var(--vw,3.9px) * 78));height:auto;align-self:stretch;border-radius:150px 150px 24px 24px}
body.mob .float{padding:8px 12px;border-radius:14px}
body.mob .float b{font-size:22px}
body.mob .float span{font-size:11px}
body.mob .float[style*="left"]{left:-14px !important;right:auto !important;top:30px !important}
body.mob .float[style*="right"]{right:-14px !important;left:auto !important;bottom:30px !important;top:auto !important}
/* macros */
body.mob .bento{flex:1;min-height:0;height:auto;grid-template-columns:1fr 1fr;grid-template-rows:1.5fr 1fr 1fr;gap:10px;margin-top:16px}
body.mob .m{padding:14px 16px;gap:8px;border-radius:20px}
body.mob .m .v{font-size:40px}
body.mob .m.big{grid-column:span 2;grid-row:auto;min-height:0}
body.mob .m.big .v{font-size:84px}
body.mob .m.wide{grid-column:span 2}
/* phases */
body.mob .track,body.mob .phases2{flex:1;min-height:0;grid-template-columns:1fr;max-width:none;gap:10px;margin-top:16px}
body.mob .track{grid-template-rows:repeat(3,1fr)}
body.mob .phases2{grid-template-rows:repeat(2,1fr)}
body.mob .ph{padding:12px 18px;gap:8px;justify-content:center;border-radius:20px}
body.mob .ph .k{font-size:40px}
body.mob .ph .rise{display:none}
/* meals */
body.mob .meal{flex-direction:column;align-items:stretch;gap:12px}
body.mob .meal .left{flex:none}
body.mob .meal .desc{font-size:16px;line-height:1.6;margin-top:10px}
body.mob .meal .right{flex:1 0 auto;width:100%;padding:16px;border-radius:22px;display:grid;column-gap:14px;row-gap:12px;align-content:stretch}
body.mob .meal .right.bk{grid-template-columns:100px 1fr;grid-template-rows:minmax(84px,1fr) auto}
body.mob .meal .right.ct{grid-template-columns:1fr;grid-template-rows:minmax(84px,1fr) auto}
body.mob .shot{grid-column:1/-1;margin:-16px -16px 0;height:auto;min-height:84px}
body.mob .donut{width:100px;height:100px;margin:0;align-self:center}
body.mob .donut .c b{font-size:22px}
body.mob .donut .c span{display:none}
body.mob .mac{gap:8px;align-self:center}
body.mob .mac>div{font-size:13px;gap:3px 8px}
body.mob .ttl{display:none}
body.mob .items{grid-column:1/-1;gap:6px}
body.mob .items div{padding:8px 11px;gap:10px;border-radius:14px}
body.mob .items b{min-width:68px;font-size:15px}
body.mob .items span{font-size:13px;line-height:1.3}
/* closing */
body.mob .close{flex-direction:column-reverse;gap:16px;padding:64px 20px 84px}
body.mob .close .txt{flex:none}
body.mob .close .chip{display:none}
body.mob .close h1{font-size:40px;margin-top:0;white-space:normal}
body.mob .close .frame{flex:1;width:100%;height:auto;min-height:140px;border-radius:24px}
body.mob .cc{align-self:stretch;padding:14px 18px;margin-top:14px}
body.mob .cc .nm{font-size:24px}
body.mob .cc .tel{font-size:34px;white-space:nowrap}
body.mob .cc .btns{margin-top:10px}
body.mob .cc .btns a{padding:10px 22px;font-size:15px}
/* controls (real px, outside the scaled stage) */
body.mob #ui{opacity:1;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
body.mob #ui button{width:44px;height:44px}
body.mob #fs{display:none}

 p23c:'المرحلة 2 و3',p23h:'المرحلة الثانية والثالثة',p23l:'نفس الهيكل · سعرات أعلى · أكل أكتر',delta:d=>`+${d} سعرة عن المرحلة 1`,
 fin:'كلمة أخيرة',coach:'كابتن معتز',call:'اتصال',wa:'واتساب',tb:'التضخيم',tc:'التنشيف'};
const FOOD='var(--p5)';
const BULK={key:'bulk',title:['خطة','التضخيم'],en:'نظام غذائي عام للتضخيم<br>خلال شهر ونصف',
  photo:'var(--p1)',photoPos:'50% 30%',z:1.55,o:'72% 30%',
  floats:[['2792','سعرة / يوم · المرحلة 1'],['7','وجبات يوميًا']],
  macros:{kcal:2792,c:343,p:157,f:91,sub:'أول 3 أيام'},
  phases:[{n:1,a:1,b:10,kcal:2792,c:343,p:157,f:91},{n:2,a:11,b:20,kcal:3242,c:421,p:156,f:105},{n:3,a:21,b:30,kcal:3515,c:478,p:159,f:109}],
  meals:[
   {t:'الفطار',s:'(مبدئي)',d:'50 جرام فشار + ملعقة صغيرة سمن/زبدة<br>+ 250-500 مجم ملح هيمالايا<br>+ 2 كوب ماء',cal:320,p:6,c:56,f:10},
   {t:'الفطار',s:'(أساسي)',d:'3 بيضات (مقلية) + ملعقة صغيرة سمن/زبدة<br>+ 30 جرام موتزاريلا + 6 شرائح توست<br>+ خيارة + 2 كوب ماء',cal:650,p:42,c:48,f:32},
   {t:'التصبيرة الأولى',s:'',d:'زبدية كبيرة + قهوة أو شاي<br>(من غير سكر أو بقطرات دايت)',cal:200,p:5,c:15,f:8},
   {t:'التصبيرة الثانية',s:'',d:'300 جرام لحمة مفرومة + 300 جرام بطاطس مهروسة<br>أو 125 جرام بطاطس مسلوقة (حسب الرغبة)<br>+ 2 كوب ماء',cal:700,p:45,c:70,f:28},
   {t:'الغداء',s:'',d:'150 جرام صدور دجاج (من غير جلد)<br>+ نص طماطمة + 2 شريحة توست<br>+ 2 كوب ماء',cal:550,p:50,c:45,f:16},
   {t:'التصبيرة الثالثة',s:'',d:'30 جرام لوز + 2 كوب ماء<br>+ كوب لبن (كامل الدسم)',cal:380,p:14,c:12,f:28},
   {t:'العشاء',s:'',d:'300 جرام بطاطس مهروسة أو مشوية<br>+ موتزاريلا (30 جرام)',cal:520,p:24,c:60,f:18}],
  close:{h:['حيث','تتألق','الأجسام'],photo:'var(--p2)',pos:'50% 35%',z:1.9,o:'37% 32%'}};
const CUT={key:'cut',title:['خطة','التنشيف'],en:'خطة عامة للتخسيس<br>خلال شهر ونصف',
  photo:'var(--p3)',photoPos:'58% 50%',z:1.7,o:'58% 90%',
  floats:[['1928','سعرة / يوم'],['6','وجبات يوميًا']],
  macros:{kcal:1928,c:156,p:141,f:79,sub:'كل يوم'},
  meals:[
   {t:'الفطار',s:'(مبدئي)',d:'50 جرام فشار + ملعقة صغيرة سمن بلدي حيواني أو قطعة زبدة صغيرة جدًا + 250-500 مجم ملح هيمالايا + شرب 2 كوب ماء كبير.',
    items:[['50 جم','فشار'],['1 ملعقة صغيرة','سمن بلدي حيواني أو قطعة زبدة صغيرة جدًا'],['250–500 مجم','ملح هيمالايا'],['2 كوب كبير','ماء']]},
   {t:'الفطار',s:'(أساسي)',d:'عدد 2 بيض مسلوق 13 دقيقة + شريحتين توست + 200 جرام بطاطس مهروسة + 2 كوب ماء كبير.',
    items:[['2','بيض مسلوق 13 دقيقة'],['2 شريحة','توست'],['200 جم','بطاطس مهروسة'],['2 كوب كبير','ماء']]},
   {t:'الغداء',s:'(مبدئي)',d:'200 جرام صدور دجاج مخلي + شريحة توست واحدة فقط + 2 كوب ماء كبير.',
    items:[['200 جم','صدور دجاج مخلي'],['1 شريحة','توست (واحدة فقط)'],['2 كوب كبير','ماء']]},
   {t:'الغداء',s:'(أساسي)',d:'قطعة لحم ستيك قليلة الدهون وزنها 200 جرام بعد الطهي أو 200 جرام لحم مفروم صافي مع طبخه بمكعب زبدة صغير جدًا أو معلقة صغيرة سمن بلدي حيواني + 200 جرام بطاطس مهروسة.',
    items:[['200 جم','ستيك قليل الدهون (الوزن بعد الطهي) أو لحم مفروم صافي'],['1 مكعب','زبدة صغير جدًا أو معلقة صغيرة سمن بلدي للطبخ'],['200 جم','بطاطس مهروسة']]},
   {t:'تصبيرة',s:'(لحد العشاء)',d:'100 جرام بطاطا حلوة + كوب أعشاب تخسيس أو بقدونس كرفس أو أي أعشاب سخنة من اختيارك.',
    items:[['100 جم','بطاطا حلوة'],['1 كوب','أعشاب تخسيس أو بقدونس كرفس أو أي أعشاب سخنة من اختيارك']]},
   {t:'العشاء',s:'',d:'2 بيض مسلوق 13 دقيقة + زبدية صغيرة + 30 جرام لوز مكسرات + 2 كوب ماء صغير.',
    items:[['2','بيض مسلوق 13 دقيقة'],['1 صغيرة','زبدية صغيرة'],['30 جم','لوز / مكسرات'],['2 كوب صغير','ماء']]}],
  close:{h:['حيث','تتألق','الأجسام'],photo:'var(--p4)',pos:'40% 50%',z:1.9,o:'38% 90%'}};


/* =====================================================================
   Engine — builds the slides from the data above
   ===================================================================== */
const stage = document.getElementById('stage');
const pad = n => String(n).padStart(2,'0');
const all = [];
const add = (deck, html, cls='', t='') => {
  const s = document.createElement('section');
  s.className = 'slide '+cls; s.dataset.deck = deck; if(t) s.dataset.t = t;
  s.innerHTML = html; stage.appendChild(s); all.push(s); return s;
};
const A = (i,extra='') => `data-a style="--i:${i};${extra}"`;

function donut(id,p,c,f){
  const kp=p*4,kc=c*4,kf=f*9,tot=kp+kc+kf;
  const segs=[[kp/tot*100,'var(--prot)'],[kc/tot*100,'var(--carb)'],[kf/tot*100,'var(--fat)']];
  let off=0, circles='';
  segs.forEach(([len,col])=>{
    const l=Math.max(len-1.4,.1);
    circles+=`<circle cx="100" cy="100" r="78" fill="none" stroke="${col}" stroke-width="20" pathLength="100" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${-off}"/>`;
    off+=len;
  });
  return {svg:`<svg viewBox="0 0 200 200"><defs><mask id="${id}"><circle class="reveal" cx="100" cy="100" r="78" fill="none" stroke="#fff" stroke-width="30" pathLength="100"/></mask></defs>
    <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="20"/><g mask="url(#${id})">${circles}</g></svg>`,
    pct:segs.map(s=>Math.round(s[0]))};
}

function build(D){
  const k=D.key, nm=D.meals.length, G=T.g;
  add(k,`
    <div class="txt">
      <div class="chip" ${A(0)}><i></i>${k==='bulk'?T.lean:T.cutc}</div>
      <h1 ${A(1)}>${D.title[0]}<br><span class="grad">${D.title[1]}</span></h1>
      <div class="en" ${A(2)}>${D.en}</div>
      <div class="hint" ${A(4)}><kbd>${T.arrow}</kbd> ${T.hint}</div>
    </div>
    <div class="wrap" ${A(2)}>
      <div class="arch"><div class="photo" style="background-image:${bg(D.photo)};background-position:${D.photoPos};--z:${D.z||1};--o:${D.o||'50% 50%'}"></div></div>
      <div class="float" style="left:-46px;top:90px"><b class="grad">${D.floats[0][0]}</b><span>${D.floats[0][1]}</span></div>
      <div class="float" style="right:-34px;bottom:70px"><b class="grad">${D.floats[1][0]}</b><span>${D.floats[1][1]}</span></div>
    </div>`,'title','zoom');

  const M=D.macros, tot=M.c*4+M.p*4+M.f*9;
  add(k,`
    <div class="chip" ${A(0)}><i></i>${T.plan} · ${M.sub}</div>
    <h2 ${A(1)}>${T.daily}</h2>
    <p class="lead" ${A(2)}>${k==='bulk'?T.found1:T.found2}</p>
    <div class="bento">
      <div class="card m big" ${A(3)}><div class="l">${T.cal}</div><div><div class="v grad"><span data-count="${M.kcal}">0</span></div><div class="lead" style="margin-top:6px">${T.kcalDay}</div></div></div>
      <div class="card m" ${A(4,'--c:var(--prot)')}><div class="l">${T.prot}</div><div class="v"><span data-count="${M.p}">0</span><small>${G}</small></div><div class="meter"><i style="--w:${Math.round(M.p*4/tot*100)}%"></i></div></div>
      <div class="card m" ${A(5,'--c:var(--carb)')}><div class="l">${T.carb}</div><div class="v"><span data-count="${M.c}">0</span><small>${G}</small></div><div class="meter"><i style="--w:${Math.round(M.c*4/tot*100)}%"></i></div></div>
      <div class="card m wide" ${A(6,'--c:var(--fat)')}><div class="l">${T.fat}</div><div class="v"><span data-count="${M.f}">0</span><small>${G}</small></div><div class="meter"><i style="--w:${Math.round(M.f*9/tot*100)}%"></i></div></div>
    </div>`,'','');

  const pills=p=>`<div class="mm"><span><em>${T.mc[0]}</em>${p.c}${G}</span><span><em>${T.mc[1]}</em>${p.p}${G}</span><span><em>${T.mc[2]}</em>${p.f}${G}</span></div>`;
  if(D.phases){
    const mx=Math.max(...D.phases.map(p=>p.kcal));
    add(k,`
      <div class="chip" ${A(0)}><i></i>${T.phasesChip}</div>
      <h2 ${A(1)}>${T.journey}</h2>
      <p class="lead" ${A(2)}>${T.jlead}</p>
      <div class="track">${D.phases.map((p,i)=>`
        <div class="card ph ${i==2?'hot':''}" ${A(3+i)}>
          <div class="h">${T.phase(p.n)}<span>${T.days(p.a,p.b)}</span></div>
          <div class="k grad">${p.kcal}<small>${T.kcal}</small></div>
          ${pills(p)}
          <div class="rise" style="--h:${Math.round(18+(p.kcal-2500)/(mx-2500)*72)}px"></div>
        </div>`).join('')}</div>`,'','rise');
  }

  D.meals.forEach((m,i)=>{
    const head=`<div class="chip" ${A(0)}><i></i>${T.mealOf(i+1,nm)}</div>
      <h2 ${A(1)}>${m.t} ${m.s?`<small>${m.s}</small>`:''}</h2>`;
    const shot=`<div class="shot"><div class="photo" style="background-image:${bg(m.img||FOOD)}"></div></div>`;
    let left, right;
    left=`${head}<p class="desc" ${A(2)}>${m.d}</p>`;
    if(D.key==='bulk'){
      const d=donut('m'+i,m.p,m.c,m.f);
      right=`<div class="card right bk" ${A(2)}>${shot}
        <div class="donut">${d.svg}<div class="c"><b>${m.cal}</b><span>${T.cent}</span></div></div>
        <div class="mac">
          <div style="--c:var(--prot)"><span>${T.prot}</span><span>${T.ap}${m.p}${G}<em>${d.pct[0]}%</em></span><i class="meter"><i style="--w:${d.pct[0]}%"></i></i></div>
          <div style="--c:var(--carb)"><span>${T.carb}</span><span>${T.ap}${m.c}${G}<em>${d.pct[1]}%</em></span><i class="meter"><i style="--w:${d.pct[1]}%"></i></i></div>
          <div style="--c:var(--fat)"><span>${T.fat}</span><span>${T.ap}${m.f}${G}<em>${d.pct[2]}%</em></span><i class="meter"><i style="--w:${d.pct[2]}%"></i></i></div>
        </div></div>`;
    } else {
      right=`<div class="card right ct" ${A(2)}>${shot}<div class="ttl">${T.plate}</div>
        <div class="items">${m.items.map(it=>`<div><b>${it[0]}</b><span>${it[1]}</span></div>`).join('')}</div></div>`;
    }
    add(k,`<div class="left">${left}</div>${right}`,'meal', i%2?'rise':'');
  });

  if(D.phases){
    const base=D.phases[0].kcal;
    add(k,`
      <div class="chip" ${A(0)}><i></i>${T.p23c}</div>
      <h2 ${A(1)}>${T.p23h}</h2>
      <p class="lead" ${A(2)}>${T.p23l}</p>
      <div class="phases2">${D.phases.slice(1).map((p,i)=>`
        <div class="card ph hot" ${A(3+i)}>
          <div class="h">${T.phase(p.n)}<span>${T.days(p.a,p.b)}</span></div>
          <div class="k grad">${p.kcal}<small>${T.kcal}</small></div>
          <div class="delta">${T.delta(p.kcal-base)}</div>
          ${pills(p)}
        </div>`).join('')}</div>`,'','');
  }

  const C=D.close;
  add(k,`
    <div class="txt">
      <div class="chip" ${A(0)}><i></i>${T.fin}</div>
      <h1 ${A(1)}>${C.h[0]} ${C.h[1]}<br><span class="grad">${C.h[2]}</span></h1>
      <div class="card cc" ${A(3)}>
        <div class="nm grad">${T.coach}</div>
        <a class="tel" href="tel:+201007737567">0100 773 7567</a>
        <div class="btns">
          <a class="b1" href="tel:+201007737567">${T.call}</a>
          <a class="b2" href="https://wa.me/201007737567" target="_blank" rel="noopener">${T.wa}</a>
        </div>
      </div>
    </div>
    <div class="frame" ${A(2)}><div class="photo" style="background-image:${bg(C.photo)};background-position:${C.pos};--z:${C.z||1};--o:${C.o||'50% 50%'}"></div></div>`,'close','zoom');
}
build(BULK); build(CUT);

/* ---------- navigation ---------- */
const counter=document.getElementById('counter'), prog=document.getElementById('prog');
const tb=document.getElementById('tb'), tc=document.getElementById('tc');
const ACC={bulk:['#ff3b4a','#ff9a3d'],cut:['#22d3ee','#86efac']};
const root=document.documentElement;
let deck='bulk', cur=0, list=[];

function countUp(el0){
  el0.querySelectorAll('[data-count]').forEach(el=>{
    const end=+el.dataset.count, t0=performance.now()+300, dur=1300;
    const step=t=>{ const p=Math.min(Math.max((t-t0)/dur,0),1), e=1-Math.pow(1-p,4);
      el.textContent=Math.round(end*e); if(p<1) requestAnimationFrame(step); };
    el.textContent=0; requestAnimationFrame(step);
  });
}
function setDeck(d,idx=0){
  deck=d; stage.dataset.deck=d; list=all.filter(s=>s.dataset.deck===d);
  tb.classList.toggle('on',d==='bulk'); tc.classList.toggle('on',d==='cut');
  const [a,b]=ACC[d];
  ['--pa','--ta'].forEach(v=>root.style.setProperty(v,a)); ['--pb','--tb'].forEach(v=>root.style.setProperty(v,b));
  all.forEach(s=>{ if(s.dataset.deck!==d){ s.classList.remove('active','before'); s.classList.add('after'); } });
  go(idx);
}
function go(n){
  n=Math.max(0,Math.min(list.length-1,n)); cur=n;
  list.forEach((s,i)=>{ s.classList.toggle('active',i===n); s.classList.toggle('before',i<n); s.classList.toggle('after',i>n); });
  countUp(list[n]);
  counter.innerHTML=`<b>${pad(n+1)}</b> / ${pad(list.length)}`;
  prog.style.width=((n+1)/list.length*100)+'%';
  try{history.replaceState(null,'','#'+deck+(n+1));}catch(e){}
}
const next=()=>go(cur+1), prev=()=>go(cur-1);
tb.textContent=T.tb; tc.textContent=T.tc;
document.getElementById('prev').textContent=T.rtl?'›':'‹'; document.getElementById('next').textContent=T.rtl?'‹':'›';
tb.onclick=()=>deck!=='bulk'&&setDeck('bulk'); tc.onclick=()=>deck!=='cut'&&setDeck('cut');
document.getElementById('next').onclick=next; document.getElementById('prev').onclick=prev;
document.getElementById('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
addEventListener('keydown',e=>{
  const NX=T.rtl?'ArrowLeft':'ArrowRight', PV=T.rtl?'ArrowRight':'ArrowLeft';
  if([NX,'ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}
  else if([PV,'ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(list.length-1);
  else if(e.key==='f'||e.key==='F')document.getElementById('fs').click();
  else if(e.key==='1')tb.click(); else if(e.key==='2')tc.click();
});
stage.addEventListener('click',e=>{if(e.target.closest('a')||document.body.classList.contains('mob'))return;const r=stage.getBoundingClientRect();((e.clientX-r.left)>r.width/2)!==T.rtl?next():prev();});
let sx=0,sy=0;
addEventListener('touchstart',e=>{document.body.classList.add('touch');sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))(dx<0)!==T.rtl?next():prev();},{passive:true});
let lock=false;
addEventListener('wheel',e=>{if(lock||Math.abs(e.deltaY)<20)return;lock=true;e.deltaY>0?next():prev();setTimeout(()=>lock=false,700)},{passive:true});
const mq=matchMedia('(max-aspect-ratio:1/1)');
function fit(){
  const iw=innerWidth, ih=innerHeight, m=mq.matches;
  document.body.classList.toggle('mob',m); root.classList.toggle('mob',m);
  if(m){
    const s=Math.min(iw/390, ih/640), W=iw/s, H=ih/s;
    stage.style.width=W+'px'; stage.style.height=H+'px'; stage.style.transform=`scale(${s})`;
    root.style.setProperty('--vw',(W/100)+'px'); root.style.setProperty('--vh',(H/100)+'px');
  } else {
    stage.style.width=''; stage.style.height='';
    stage.style.transform=`scale(${Math.min(iw/1280,ih/720)})`;
  }
}
let _raf=0; addEventListener('resize',()=>{cancelAnimationFrame(_raf);_raf=requestAnimationFrame(fit)}); fit();

const mTab=location.hash.match(/^#(bulk|cut)(\d+)$/);
setDeck(mTab?mTab[1]:'bulk', mTab?+mTab[2]-1:0);
</script>
